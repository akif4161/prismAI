<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM 💎</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{padding:16px;text-align:center;border-bottom:1px solid #222;font-size:22px;font-weight:900}
  header span{color:#a78bfa}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:15px}
  .user{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
  .ai{background:#1f1f2a;align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap}
  #form{display:flex;gap:8px;padding:12px;border-top:1px solid #222}
  input{flex:1;background:#1f1f2a;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;outline:none;font-size:15px}
  button{background:#7c3aed;color:#fff;border:none;padding:14px 20px;border-radius:12px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header>PRISM <span>💎</span></header>
<div id="chat"></div>
<form id="form">
  <input id="input" placeholder="Bir şey yaz..." autocomplete="off" />
  <button>Gönder</button>
</form>

<script>
const API_KEY = "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";
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');

let userName = localStorage.getItem('prism_name') || '';
let history = [];

function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

// Açılış mesajı
if(userName){
  addMsg('Tekrar hoş geldin ' + userName + ' 👑 Ne soracaksın bugün?', 'ai');
} else {
  addMsg('Selam! Ben PRISM 💎 Sana nasıl hitap edeyim, adın ne?', 'ai');
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';

  // Hala isim yoksa, ilk yazdığı şeyi isim san
  if(!userName){
    userName = text.split(' ')[0];
    localStorage.setItem('prism_name', userName);
    addMsg('Memnun oldum ' + userName + ' 👑 Artık seni tanıyorum. Ne soracaksın?', 'ai');
    return;
  }

  const loading = addMsg('Yazıyor...', 'ai');
  history.push({role: 'user', content: text});
  // Son 10 mesajı hatırla
  if(history.length > 10) history = history.slice(-10);

  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          {role: 'system', content: 'Sen PRISM adında samimi, genç, Türkçe konuşan zeki bir asistansın. Kullanıcının adı ' + userName + '. Ona hep ismiyle hitap et, kral diye de ekleyebilirsin. Kısa, eğlenceli ve akıllı cevap ver. Sen zaten çok şey biliyorsun, öğretmeye gerek yok.'},
          ...history
        ],
        temperature: 0.7
      })
    });
    const data = await res.json();
    if(data.error){
      loading.textContent = 'Hata: ' + data.error.message;
    } else {
      const reply = data.choices[0].message.content;
      loading.textContent = reply;
      history.push({role: 'assistant', content: reply});
    }
  } catch(err){
    loading.textContent = 'Bağlantı hatası: ' + err.message;
  }
});
</script>
</body>
</html>
