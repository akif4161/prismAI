<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM 💎</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{padding:16px;text-align:center;border-bottom:1px solid #222;font-size:22px;font-weight:900}
  header span{color:#a78bfa}
  #login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow-y:auto}
  #login input{width:100%;max-width:320px;background:#1f1f2a;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;outline:none}
  #login button{width:100%;max-width:320px;background:#7c3aed;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
  #login .google{background:#fff;color:#000}
  #login .guest{background:#2a2a35;color:#fff;border:1px solid #444}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;display:none}
  .msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:15px}
  .user{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
  .ai{background:#1f1f2a;align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap}
  #form{display:none;gap:8px;padding:12px;border-top:1px solid #222}
  #form input{flex:1;background:#1f1f2a;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;outline:none}
  #form button{background:#7c3aed;color:#fff;border:none;padding:14px 20px;border-radius:12px;font-weight:900;cursor:pointer}
  #userInfo{font-size:13px;color:#aaa;text-align:center;padding:6px}
</style>
</head>
<body>
<header>PRISM <span>💎</span></header>
<div id="login">
  <h2>PRISM'e Hoş Geldin 👑</h2>
  <p style="color:#aaa">Nasıl girmek istersin?</p>
  <button class="google" id="googleBtn">🔵 Google ile Giriş Yap</button>
  <button class="guest" id="guestBtn">👤 Misafir Olarak Devam Et</button>
  <p style="color:#666">— veya e-posta ile —</p>
  <input id="email" placeholder="E-posta" type="email" />
  <input id="pass" placeholder="Şifre" type="password" />
  <button id="emailBtn">E-posta ile Giriş / Kayıt Ol</button>
  <p id="loginError" style="color:#ff6b6b;font-size:13px"></p>
</div>
<div id="userInfo"></div>
<div id="chat"></div>
<form id="form">
  <input id="input" placeholder="Bir şey yaz..." autocomplete="off" />
  <button>Gönder</button>
</form>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDVl8A6jOmqFkP2OujjBuC8MTqBoJiMDz8",
  authDomain: "prismai-7933b.firebaseapp.com",
  projectId: "prismai-7933b",
  storageBucket: "prismai-7933b.firebasestorage.app",
  messagingSenderId: "818649887767",
  appId: "1:818649887767:web:e7fab8d446688671331852",
  measurementId: "G-N2YZ29DFNE"
};
const GROQ_KEY = "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";
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const loginDiv = document.getElementById('login');
const chatDiv = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const userInfo = document.getElementById('userInfo');
let userName = 'Dostum';
let history = [];
function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chatDiv.appendChild(d);
  chatDiv.scrollTop = chatDiv.scrollHeight;
  return d;
}
function openChat(user, isGuest){
  loginDiv.style.display = 'none';
  chatDiv.style.display = 'flex';
  form.style.display = 'flex';
  if(isGuest){ userName = 'Misafir'; userInfo.textContent = 'Misafir olarak girdin 👤'; }
  else { userName = user.displayName || user.email.split('@')[0] || 'Dostum'; userInfo.textContent = 'Giriş yapıldı: ' + user.email; }
  addMsg('Tekrar hoş geldin ' + userName + ' 👑 Ne soracaksın?', 'ai');
}
document.getElementById('googleBtn').onclick = async ()=>{
  try{ const p = new firebase.auth.GoogleAuthProvider(); await auth.signInWithPopup(p); }
  catch(e){ document.getElementById('loginError').textContent = e.message; }
};
document.getElementById('guestBtn').onclick = async ()=>{
  try{ await auth.signInAnonymously(); }
  catch(e){ openChat(null, true); }
};
document.getElementById('emailBtn').onclick = async ()=>{
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ try{ await auth.createUserWithEmailAndPassword(email, pass); } catch(e2){ document.getElementById('loginError').textContent = e2.message; } }
};
auth.onAuthStateChanged(user=>{ if(user){ if(user.isAnonymous) openChat(user, true); else openChat(user, false); } });
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  const loading = addMsg('Yazıyor...', 'ai');
  history.push({role:'user', content:text});
  if(history.length > 10) history = history.slice(-10);
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body: JSON.stringify({ model: 'llama-3.1-8b-instant', messages: [{role:'system', content:'Sen PRISM adında samimi, genç, Türkçe konuşan zeki asistansın. Kullanıcının adı '+userName+'. Ona ismiyle hitap et. Kısa ve eğlenceli cevap ver.'}, ...history], temperature: 0.7 })
    });
    const data = await res.json();
    if(data.error) loading.textContent = 'Hata: ' + data.error.message;
    else { loading.textContent = data.choices[0].message.content; history.push({role:'assistant', content: loading.textContent}); }
  }catch(err){ loading.textContent = 'Bağlantı hatası: ' + err.message; }
});
</script>
</body>
</html>
